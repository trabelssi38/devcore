version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: devcore-postgres
    environment:
      POSTGRES_USER: devcore
      POSTGRES_PASSWORD: devcore_secure_pass
      POSTGRES_DB: devcore
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcore -d devcore"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512mb

  qdrant:
    image: qdrant/qdrant:latest
    container_name: devcore-qdrant
    environment:
      - QDRANT__STORAGE__QUANTIZATION__INT8__ALWAYS_RAM=true
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    mem_limit: 512mb

  gemini-router:
    build:
      context: .
      dockerfile: DEV_CORE/docker/Dockerfile.python
    container_name: devcore-gemini-router
    command: python DEV_CORE/Scripts/gemini_router.py
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEVCORE_GEMINI_ROUTER_BIND=0.0.0.0
      - DEVCORE_ALLOW_PUBLIC_BIND=1
      - DEVCORE_PLATFORM_ROOT=/app/DEV_CORE
      - DEVCORE_DATA_ROOT=/data
    volumes:
      - .:/app
      - devcore_data:/data
    ports:
      - "20130:20130"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20130/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 256mb

  api:
    build:
      context: .
      dockerfile: DEV_CORE/docker/Dockerfile.python
    container_name: devcore-api
    command: uvicorn DEV_CORE.API.devcore_api.app:app --host 0.0.0.0 --port 20131
    environment:
      - DEVCORE_PLATFORM_ROOT=/app/DEV_CORE
      - DEVCORE_DATA_ROOT=/data
      - QDRANT_URL=http://qdrant:6333
      - DEVCORE_DATABASE_URL=postgresql+psycopg://devcore:devcore_secure_pass@postgres:5432/devcore
    volumes:
      - .:/app
      - devcore_data:/data
    ports:
      - "20131:20131"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20131/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 512mb

  scheduler:
    build:
      context: .
      dockerfile: DEV_CORE/docker/Dockerfile.python
    container_name: devcore-scheduler
    command: python DEV_CORE/Scheduler/scheduler_tick.py
    environment:
      - DEVCORE_PLATFORM_ROOT=/app/DEV_CORE
      - DEVCORE_DATA_ROOT=/data
      - DEVCORE_DATABASE_URL=postgresql+psycopg://devcore:devcore_secure_pass@postgres:5432/devcore
      - QDRANT_URL=http://qdrant:6333
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
    volumes:
      - .:/app
      - devcore_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    mem_limit: 256mb

  dashboard-api:
    build:
      context: .
      dockerfile: DEV_CORE/docker/Dockerfile.python
    container_name: devcore-dashboard-api
    command: python DEV_CORE/Scripts/dashboard_api.py
    environment:
      - DEVCORE_PLATFORM_ROOT=/app/DEV_CORE
      - DEVCORE_DATA_ROOT=/data
    volumes:
      - .:/app
      - devcore_data:/data
    ports:
      - "20129:20129"
    depends_on:
      - api
    mem_limit: 256mb

  web:
    build:
      context: .
      dockerfile: DEV_CORE/Web/Dockerfile
    container_name: devcore-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_DEVCORE_API_URL=http://localhost:20131
      - NEXT_PUBLIC_DASHBOARD_API_URL=http://localhost:20129
    depends_on:
      - api
      - dashboard-api
    mem_limit: 512mb

  mcp-qdrant:
    build:
      context: .
      dockerfile: DEV_CORE/docker/Dockerfile.python
    container_name: devcore-mcp-qdrant
    command: python DEV_CORE/MCP/qdrant-storage/server.py
    environment:
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    mem_limit: 128mb

  mcp-devcore:
    build:
      context: .
      dockerfile: DEV_CORE/docker/Dockerfile.python
    container_name: devcore-mcp-devcore
    command: python DEV_CORE/MCP/devcore-scripts/server.py
    environment:
      - DEVCORE_PLATFORM_ROOT=/app/DEV_CORE
      - DEVCORE_DATA_ROOT=/data
    volumes:
      - .:/app
      - devcore_data:/data
    depends_on:
      - api
    mem_limit: 128mb

volumes:
  postgres_data:
  qdrant_storage:
  devcore_data:
