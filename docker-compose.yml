version: "3.8"

services:
  gemini-router:
    build:
      context: .
      dockerfile: DEV_CORE/docker/Dockerfile.python
    container_name: devcore-gemini-router
    command: python DEV_CORE/Scripts/gemini_router.py
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEVCORE_GEMINI_ROUTER_BIND=0.0.0.0
      - DEVCORE_ALLOW_PUBLIC_BIND=1
      - DEVCORE_PLATFORM_ROOT=/app/DEV_CORE
      - DEVCORE_DATA_ROOT=/data
    volumes:
      - .:/app
      - ./DEV_CORE_DATA:/data
    ports:
      - "20130:20130"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20130/v1/models"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 256mb

  api:
    build:
      context: .
      dockerfile: DEV_CORE/docker/Dockerfile.python
    container_name: devcore-api
    command: uvicorn DEV_CORE.API.devcore_api.app:app --host 0.0.0.0 --port 20131
    environment:
      - DEVCORE_PLATFORM_ROOT=/app/DEV_CORE
      - DEVCORE_DATA_ROOT=/data
    volumes:
      - .:/app
      - ./DEV_CORE_DATA:/data
    ports:
      - "20131:20131"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20131/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: 512mb

  scheduler:
    build:
      context: .
      dockerfile: DEV_CORE/docker/Dockerfile.python
    container_name: devcore-scheduler
    command: python DEV_CORE/Scheduler/scheduler_tick.py
    environment:
      - DEVCORE_PLATFORM_ROOT=/app/DEV_CORE
      - DEVCORE_DATA_ROOT=/data
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
    volumes:
      - .:/app
      - ./DEV_CORE_DATA:/data
      - C:\src:/src
    mem_limit: 256mb

  dashboard-api:
    build:
      context: .
      dockerfile: DEV_CORE/docker/Dockerfile.python
    container_name: devcore-dashboard-api
    command: python DEV_CORE/Scripts/dashboard_api.py
    environment:
      - DEVCORE_PLATFORM_ROOT=/app/DEV_CORE
      - DEVCORE_DATA_ROOT=/data
      - DEVCORE_DASHBOARD_BIND=0.0.0.0
      - DEVCORE_ALLOW_PUBLIC_BIND=1
      - DEVCORE_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - GEMINI_ROUTER_HOST=gemini-router
      - DASHBOARD_API_HOST=dashboard-api
      - API_HOST=api
      - HEADROOM_HOST=host.docker.internal
      - REPOWISE_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - ./DEV_CORE_DATA:/data
      - C:\src:/src
    ports:
      - "20129:20129"
    depends_on:
      - api
    mem_limit: 256mb

  web:
    build:
      context: .
      dockerfile: DEV_CORE/Web/Dockerfile
    container_name: devcore-web
    ports:
      - "127.0.0.1:30000:3000"
    environment:
      - DEVCORE_API_URL=http://api:20131
      - DEVCORE_DASHBOARD_URL=http://dashboard-api:20129
    depends_on:
      - api
      - dashboard-api
    mem_limit: 512mb

  mcp-devcore:
    build:
      context: .
      dockerfile: DEV_CORE/docker/Dockerfile.python
    container_name: devcore-mcp-devcore
    command: python DEV_CORE/MCP/devcore-scripts/server.py
    environment:
      - DEVCORE_PLATFORM_ROOT=/app/DEV_CORE
      - DEVCORE_DATA_ROOT=/data
    volumes:
      - .:/app
      - ./DEV_CORE_DATA:/data
    depends_on:
      - api
    mem_limit: 128mb

volumes:
  devcore_data:
