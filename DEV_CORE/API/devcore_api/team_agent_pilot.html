<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent pilote · DevCore</title>
  <style>
    :root{color-scheme:dark;font:14px/1.5 ui-monospace,Consolas,monospace;background:#080c14;color:#d8e9f4}
    *{box-sizing:border-box}body{max-width:960px;margin:0 auto;padding:20px}
    header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #263449;padding-bottom:12px}
    h1{font-size:18px;color:#28c7e8;margin:0}h2{font-size:14px;color:#85bfd6;margin:0 0 10px}
    a{color:#55d7f0}section{border:1px solid #263449;background:#0d1420;margin-top:16px;padding:16px}
    label{display:block;margin:10px 0;color:#9bb7c8}input,textarea{width:100%;border:1px solid #34506a;background:#070e18;color:#eefaff;padding:9px;font:inherit}
    textarea{min-height:90px;resize:vertical}button{border:1px solid #4a7390;background:#183047;color:#d9f4ff;padding:7px 12px;font:inherit;cursor:pointer}
    button:disabled{opacity:.45;cursor:default}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .proposal{border-top:1px solid #263449;padding:10px 0}.proposal:first-child{border-top:0}
    .muted{color:#829baa}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#060a11;border:1px solid #263449;padding:12px;max-height:45vh;overflow:auto}
    #status{min-height:22px}#status[data-error="true"]{color:#ff8d9c}#identity{font-size:12px;color:#91b9ca}
  </style>
</head>
<body>
  <header><div><h1>Agent pilote · devcore</h1><span id="identity">Connexion…</span></div>
    <a href="/index_terminal.html?project=devcore">Retour au Cockpit</a></header>
  <section><h2>Nouvelle proposition</h2>
    <p class="muted">Codex lit le checkout pilote et prépare un changement. Aucun fichier n'est modifié avant l'approbation du patch.</p>
    <form id="request-form"><label>Fichier existant sous DEV_CORE
      <input id="target-file" required value="DEV_CORE/Scripts/global_restart_budget.py"></label>
      <label>Tâche à proposer<textarea id="task-text" required maxlength="8000"></textarea></label>
      <div class="row"><button id="submit" type="submit">Préparer une proposition</button>
        <button id="cancel" type="button" hidden>Annuler le run</button></div></form>
    <p id="status" role="status"></p></section>
  <section><h2>Propositions récentes</h2><div id="proposals" class="muted">Chargement…</div></section>
  <section id="review" hidden><h2>Patch à approuver</h2><p id="summary"></p>
    <p class="muted">Empreinte SHA-256 : <code id="digest"></code></p>
    <pre id="patch"></pre><button id="approve" type="button">Approuver et appliquer ce patch</button></section>
  <script>
  (() => {
    'use strict';
    const project='devcore';
    const $=id=>document.getElementById(id);
    let session=null, activeRun=null, selected=null;
    function status(message,error=false){$('status').textContent=message;$('status').dataset.error=String(error)}
    async function request(path,options={}){
      const response=await fetch(path,{credentials:'same-origin',cache:'no-store',...options});
      if(response.status===401){location.assign('/login?project=devcore&next='+encodeURIComponent(location.pathname+location.search));throw Error('Session expirée')}
      const payload=await response.json();
      if(!response.ok)throw Error(payload.detail?.message||payload.detail||payload.message||'Requête refusée');
      return payload;
    }
    function mutationHeaders(key){return {'Content-Type':'application/json','X-CSRF-Token':session.csrf_token,
      ...(key?{'Idempotency-Key':key}:{})}}
    async function refreshProposals(){
      const payload=await request('/api/v1/agent/proposals?project='+project);
      const box=$('proposals');box.replaceChildren();
      if(!payload.proposals.length){box.textContent='Aucune proposition.';return}
      for(const item of payload.proposals){
        const row=document.createElement('div');row.className='proposal';
        const title=document.createElement('strong');title.textContent=item.summary;
        const meta=document.createElement('div');meta.className='muted';meta.textContent=item.status+' · '+item.paths.join(', ');
        const button=document.createElement('button');button.type='button';button.textContent='Examiner';
        button.addEventListener('click',()=>review(item.id));row.append(title,meta,button);box.append(row)
      }
    }
    async function review(id){
      selected=await request('/api/v1/agent/proposals/'+encodeURIComponent(id)+'?project='+project);
      $('summary').textContent=selected.summary;$('digest').textContent=selected.sha256;
      $('patch').textContent=selected.patch;$('review').hidden=false;
      $('approve').disabled=selected.status!=='waiting_approval'||!session.actions.includes('task.mutate');
      $('review').scrollIntoView({behavior:'smooth',block:'start'})
    }
    async function pollRun(){
      if(!activeRun)return;
      const run=await request('/api/v1/runs/'+encodeURIComponent(activeRun)+'?project='+project);
      status('Run '+activeRun+' : '+run.status);
      if(['succeeded','failed','cancelled','timed_out'].includes(run.status)){
        $('cancel').hidden=true;activeRun=null;sessionStorage.removeItem('devcore-agent-run');
        if(run.status==='succeeded'){
          let result=null;try{result=JSON.parse((run.output||'').trim().split('\n').at(-1))}catch{}
          await refreshProposals();
          if(result?.id)await review(result.id);
          status(result?.id?'Proposition prête : '+result.id:'Run terminé ; consulte les propositions.')
        }else status('Run '+run.status+' : '+(run.error||'voir son historique'),true);
      }else setTimeout(()=>pollRun().catch(e=>status(e.message,true)),2000)
    }
    $('request-form').addEventListener('submit',async event=>{
      event.preventDefault();if(!session?.actions.includes('task.mutate'))return status('Droit d’écriture requis.',true);
      $('submit').disabled=true;
      try{
        const payload=await request('/api/v1/agent/proposals',{method:'POST',headers:mutationHeaders(crypto.randomUUID()),
          body:JSON.stringify({project,file:$('target-file').value.trim(),task:$('task-text').value.trim()})});
        activeRun=payload.run_id;sessionStorage.setItem('devcore-agent-run',activeRun);$('cancel').hidden=false;
        status('Proposition en cours : '+activeRun);pollRun().catch(e=>status(e.message,true));
      }catch(e){status(e.message,true)}finally{$('submit').disabled=false}
    });
    $('cancel').addEventListener('click',async()=>{
      if(!activeRun)return;
      try{await request('/api/v1/runs/'+encodeURIComponent(activeRun)+'/cancel?project='+project,
        {method:'POST',headers:mutationHeaders()});status('Annulation demandée.')}catch(e){status(e.message,true)}
    });
    $('approve').addEventListener('click',async()=>{
      if(!selected||selected.status!=='waiting_approval')return;
      if(!confirm('Appliquer exactement le patch SHA-256 '+selected.sha256+' ?'))return;
      $('approve').disabled=true;
      try{const result=await request('/api/v1/agent/proposals/'+encodeURIComponent(selected.id)+'/approve',
        {method:'POST',headers:mutationHeaders(),body:JSON.stringify({project,sha256:selected.sha256})});
        status('Patch appliqué par '+result.approved_by);await refreshProposals();await review(selected.id);
      }catch(e){status(e.message,true);$('approve').disabled=false}
    });
    (async()=>{try{session=await request('/api/auth/session');
      if(session.project!==project)throw Error('Session devcore requise');
      $('identity').textContent='Utilisateur : '+session.user_id;
      $('submit').disabled=!session.actions.includes('task.mutate');
      await refreshProposals();activeRun=sessionStorage.getItem('devcore-agent-run');
      if(activeRun){$('cancel').hidden=false;pollRun().catch(e=>status(e.message,true))}
    }catch(e){status(e.message,true)}})();
  })();
  </script>
</body></html>
