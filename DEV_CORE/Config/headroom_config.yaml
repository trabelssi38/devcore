proxy:
  port: 8787
  upstream: "http://127.0.0.1:20128"  # 9Router
  
compression:
  json: true          # SmartCrusher pour JSON (remplace TOON)
  code: true          # CodeCompressor AST-aware
  logs: true          # LogCompressor (remplace RTK)
  prose: true         # Kompress-base

cache_aligner:
  enabled: true       # Stabilise les préfixes pour KV cache
  
ccr:
  enabled: true       # Reversible compression
  # Cache local machine (hors Dropbox) — voir DEVCORE_LOCAL_ROOT
  cache_dir: "C:/Users/Administrateur/Dropbox/DEV_CORE_DATA/Cache/headroom"

stats:
  enabled: true
  # Metrics locales machine (hors Dropbox)
  output: "C:/Users/Administrateur/Dropbox/DEV_CORE_DATA/Metrics/headroom_stats.json"
