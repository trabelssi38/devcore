# Declarative route contract, not a Headroom CLI configuration file.
# Runtime source of truth: Scripts/headroom_routes.py (fixed parameters + guard).
profiles:
  native:
    port: 8787
    upstream_policy: native_provider
    preserve_requested_model: true
  auxiliary:
    port: 8789
    openai_upstream: http://127.0.0.1:20130
    allowed_models: [devcore-writing, devcore-documentation, devcore-summary, devcore-bulk]
embeddings:
  endpoint: http://127.0.0.1:20130/v1/embeddings
metrics:
  native: http://127.0.0.1:8787/devcore/routes
  auxiliary: http://127.0.0.1:8789/devcore/routes
  router_stats: gemini_auxiliary_stats.json
# No shared filesystem cache or model routing; compression defaults to lossless.
