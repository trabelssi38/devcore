# Exemple de recette uniquement : remplacer les chemins/projet avant utilisation.
# L'API doit fonctionner avec DEVCORE_DASHBOARD_AUTH_PROFILE=individual.
# Ne pas copier de token dans ce fichier. Le fichier privé vient d'issue-token
# avec --action context.read et un seul --project, sous NTFS protégé.
[mcp_servers.devcore_individual]
command = "E:/DevCoreRuntime/releases/devcore-py313-20261002/Scripts/python.exe"
args = ["E:/src_python/devcore/DEV_CORE/MCP/devcore-scripts/server.py"]
cwd = "E:/src_python/devcore"
startup_timeout_sec = 30
tool_timeout_sec = 30
enabled_tools = ["devcore_project_context"]

[mcp_servers.devcore_individual.env]
DEVCORE_MCP_AUTH_PROFILE = "individual"
DEVCORE_MCP_TASK_AUDIT = "0"
DEVCORE_MCP_API_URL = "http://127.0.0.1:20129"
DEVCORE_MCP_PROJECT = "devcore"
DEVCORE_MCP_CREDENTIAL_FILE = "E:/DevCoreSecrets/Users/UTILISATEUR/context.json"
DEVCORE_CONTEXT_MAX_BYTES = "12000"
DEVCORE_MCP_API_TIMEOUT_SECONDS = "10"
DEVCORE_MCP_TASK_ACCESS = "disabled"

# Pause/reprise : TASK_ACCESS=write, READ_ONLY=0 et TASK_TRANSITIONS=1,
# enabled_tools inclut devcore_task_pause/devcore_task_resume ; task.mutate requis.
# Activation désactivée dans cet exemple ; aucun droit serveur accordé par le flag.
DEVCORE_MCP_TASK_TRANSITIONS = "0"
