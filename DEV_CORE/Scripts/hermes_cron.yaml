# DEV_CORE v6.1 — Cron Configuration for Hermes Agent
# Emplacement: C:/devcore/DEV_CORE/Scripts/hermes_cron.yaml
# Timezone: Europe/Paris

version: "1.0"

cron_tasks:
  # Demarrage quotidien - 10h du matin
  - id: "daily_launch"
    name: "DEV_CORE Daily Launch"
    description: "Demarrage quotidien - verifie infra, charge task active, detection auto"
    schedule: "0 10 * * *"
    timezone: "Europe/Paris"
    enabled: true
    catchup: true
    command:
      type: "powershell"
      script: "C:/devcore/DEV_CORE/Scripts/launch.ps1"
      args: []

  # Cloture quotidienne - 4h du matin
  - id: "daily_endday"
    name: "DEV_CORE Daily Endday"
    description: "Cloture quotidienne - extract lessons, sync Qdrant, sync Obsidian"
    schedule: "0 4 * * *"
    timezone: "Europe/Paris"
    enabled: true
    catchup: false
    command:
      type: "powershell"
      script: "C:/devcore/DEV_CORE/Scripts/endday.ps1"
      args: ["-SkipBackup"]

  # Maintenance hebdomadaire - Dimanche 5h du matin
  - id: "weekly_maintenance"
    name: "DEV_CORE Weekly Maintenance"
    description: "Maintenance hebdomadaire - rotation memoire, backup, cleanup"
    schedule: "0 5 * * 0"
    timezone: "Europe/Paris"
    enabled: true
    catchup: false
    command:
      type: "powershell"
      script: "C:/devcore/DEV_CORE/Scripts/Auto/weekly_maintenance.ps1"
      args: []

  # NOUVEAU : Scan automatique des tâches — toutes les 10 minutes
  - id: "periodic_task_scan"
    name: "DEV_CORE Periodic Task Scan"
    description: "Scan git + specs + prompts toutes les 10 min"
    schedule: "*/10 * * * *"
    timezone: "Europe/Paris"
    enabled: true
    catchup: false
    command:
      type: "powershell"
      script: "C:/devcore/DEV_CORE/Scripts/task_scan.ps1"
      args: []

  # NOUVEAU : Sync + Dashboard — 5 minutes après chaque scan
  - id: "periodic_task_sync_dashboard"
    name: "DEV_CORE Periodic Sync & Dashboard"
    description: "Sync tâches et régénère le dashboard"
    schedule: "5,15,25,35,45,55 * * * *"
    timezone: "Europe/Paris"
    enabled: true
    catchup: false
    command:
      type: "powershell"
      script: "C:/devcore/DEV_CORE/Scripts/task_sync.ps1"
      args: []

  # NOUVEAU : Event watcher — réactif aux événements bus
  - id: "event_watcher"
    name: "DEV_CORE Event Watcher"
    description: "Traite les événements du bus (post-commit, etc.)"
    schedule: "*/2 * * * *"
    timezone: "Europe/Paris"
    enabled: true
    catchup: false
    command:
      type: "powershell"
      script: "C:/devcore/DEV_CORE/Scripts/Auto/event_watcher.ps1"
      args: []

# Notification settings
notifications:
  on_success: false
  on_failure: true
  delivery:
    - type: "log"
      path: "C:/devcore/DEV_CORE_DATA/Logs/hermes/cron.log"
    # Ajouter Telegram/Discord ici si configure
    # - type: "telegram"
    #   token: "${TELEGRAM_BOT_TOKEN}"
    #   chat_id: "${TELEGRAM_CHAT_ID}"

# Persistence settings (pour Daytona/Modal si utilise)
persistence:
  enabled: true
  backend: "daytona"  # ou "modal", "local"
  hibernate_timeout: 3600  # 1h idle avant hibernation

