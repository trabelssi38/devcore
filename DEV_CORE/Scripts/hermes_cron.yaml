# DEV_CORE v9.0 — Cron Configuration for Hermes Active Agent
# Emplacement: C:/devcore/DEV_CORE/Scripts/hermes_cron.yaml
# Timezone: Europe/Paris

version: "1.0"

cron_tasks:
  # Demarrage quotidien - 10h du matin
  - id: "daily_launch"
    name: "DEV_CORE Daily Launch"
    description: "Demarrage quotidien - verifie infra, charge task active, detection auto"
    schedule: "0 10 * * *"
    timezone: "Europe/Paris"
    enabled: true
    catchup: true
    script: "launch_wrapper.py"
    no_agent: true
    workdir: "C:/devcore"

  # Cloture quotidienne - 4h du matin
  - id: "daily_endday"
    name: "DEV_CORE Daily Endday"
    description: "Cloture quotidienne - extract lessons, sync Qdrant, sync Obsidian"
    schedule: "0 4 * * *"
    timezone: "Europe/Paris"
    enabled: true
    catchup: false
    script: "endday_wrapper.py"
    no_agent: true
    workdir: "C:/devcore"

  # Maintenance hebdomadaire - Dimanche 5h du matin
  - id: "weekly_maintenance"
    name: "DEV_CORE Weekly Maintenance"
    description: "Maintenance hebdomadaire - rotation memoire, backup, cleanup"
    schedule: "0 5 * * 0"
    timezone: "Europe/Paris"
    enabled: true
    catchup: false
    script: "weekly_maintenance_wrapper.py"
    no_agent: true
    workdir: "C:/devcore"

  # Scan automatique des tâches — toutes les 10 minutes
  - id: "periodic_task_scan"
    name: "DEV_CORE Periodic Task Scan"
    description: "Scan git + specs + prompts toutes les 10 min"
    schedule: "*/10 * * * *"
    timezone: "Europe/Paris"
    enabled: true
    catchup: false
    script: "task_scan_wrapper.py"
    no_agent: true
    workdir: "C:/devcore"

  # Sync + Dashboard — 5 minutes après chaque scan
  - id: "periodic_task_sync_dashboard"
    name: "DEV_CORE Periodic Sync & Dashboard"
    description: "Sync tâches et régénère le dashboard"
    schedule: "5,15,25,35,45,55 * * * *"
    timezone: "Europe/Paris"
    enabled: true
    catchup: false
    script: "task_sync_wrapper.py"
    no_agent: true
    workdir: "C:/devcore"

  # Event watcher — réactif aux événements bus
  - id: "event_watcher"
    name: "DEV_CORE Event Watcher"
    description: "Traite les événements du bus (post-commit, etc.)"
    schedule: "*/2 * * * *"
    timezone: "Europe/Paris"
    enabled: true
    catchup: false
    script: "event_watcher_wrapper.py"
    no_agent: true
    workdir: "C:/devcore"

  # 7. Agent Actif Autonome — s'exécute toutes les 5 minutes
  - id: "active_agent_task_runner"
    name: "DEV_CORE Active Agent Task Runner"
    description: "Spawns AIAgent to autonomously execute the current active task if present"
    schedule: "*/5 * * * *"
    timezone: "Europe/Paris"
    enabled: true
    catchup: false
    script: "check_active_task.py"
    no_agent: false
    workdir: "C:/devcore"
    prompt: |
      You are the DevCore Active Agent, an autonomous coding and reasoning assistant.
      An active task has been assigned to you. Read the task details, title, and steps in the "Script Output" section above.

      Your goal is to work systematically through the task steps, implement all required code changes, verify your changes, and record progress.

      Guidelines for execution:
      1. **Understand & Plan**: Check the existing codebase, read files, and plan your approach.
      2. **Execute steps**:
         - Work through each step defined in the task.
         - You can mark steps as done by running: `powershell -ExecutionPolicy Bypass -File C:\devcore\DEV_CORE\Scripts\dc.ps1 step done [step_number]`
         - Or you can edit files using filesystem tools.
      3. **Commit often**: Make clean git commits for completed steps with clear messages (e.g. `feat(my-feature): implement step 1`).
      4. **Timeout clean exit (CRITICAL)**:
         - Keep track of your elapsed execution time. Schedulers usually enforce a maximum execution duration.
         - If you have been running for more than 8 minutes (480 seconds) and there are still uncompleted steps, do not start new major tasks.
         - Perform a clean commit of your current progress (e.g., `work(my-task): intermediate checkpoint before timeout`), keep the task status as 'active', and exit.
         - The scheduler will automatically spin up a new session on the next tick (5 minutes later) to let you resume exactly where you left off.
      5. **Complete the task**:
         - Once all steps are complete, mark the task as done by running: `powershell -ExecutionPolicy Bypass -File C:\devcore\DEV_CORE\Scripts\dc.ps1 task done`
         - This command will automatically run memory extraction, Qdrant sync, Obsidian sync, and refresh the dashboard.
      6. **No Placeholders**: Never write placeholder code or comments. Implement fully working code.

  # Mise à jour périodique Repowise — toutes les 5 minutes
  - id: "periodic_repowise_update"
    name: "DEV_CORE Periodic Repowise Update"
    description: "Met à jour l'index Repowise en mode fast et index-only"
    schedule: "*/5 * * * *"
    timezone: "Europe/Paris"
    enabled: true
    catchup: false
    script: "repowise_update_wrapper.py"
    no_agent: true
    workdir: "C:/devcore"

# Notification settings
notifications:
  on_success: false
  on_failure: true
  delivery:
    - type: "log"
      path: "C:/devcore/DEV_CORE_DATA/Logs/hermes/cron.log"

# Persistence settings
persistence:
  enabled: true
  backend: "local"
  hibernate_timeout: 3600
