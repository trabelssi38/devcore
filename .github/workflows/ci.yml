name: DEV_CORE CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DEVCORE_PLATFORM_ROOT: ${{ github.workspace }}\DEV_CORE
      DEVCORE_DATA_ROOT: ${{ github.workspace }}\DEV_CORE_DATA
      DEVCORE_SKIP_DASHBOARD: "1"
    steps:
      - name: Checkout
        timeout-minutes: 2
        uses: actions/checkout@v4

      - name: Setup Python
        timeout-minutes: 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        timeout-minutes: 5
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r DEV_CORE\requirements-ci.txt

      - name: Lint PowerShell and Python
        timeout-minutes: 3
        shell: pwsh
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File DEV_CORE\Scripts\ci_lint.ps1

      - name: Run Python tests
        timeout-minutes: 5
        shell: pwsh
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File DEV_CORE\Scripts\ci_python_tests.ps1

      - name: Run PowerShell tests
        timeout-minutes: 8
        shell: pwsh
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File DEV_CORE\Scripts\ci_powershell_tests.ps1

      - name: Secret scan
        timeout-minutes: 3
        shell: pwsh
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File DEV_CORE\Scripts\secret_scan.ps1 -Path .

      - name: Contract checks
        timeout-minutes: 4
        shell: pwsh
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File DEV_CORE\Scripts\ci_contract_tests.ps1

      - name: Reference benchmarks
        timeout-minutes: 4
        shell: pwsh
        run: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File DEV_CORE\Scripts\benchmark_reference.ps1 -Json

      - name: Upload benchmark artifacts
        timeout-minutes: 2
        uses: actions/upload-artifact@v4
        with:
          name: devcore-reference-benchmarks
          path: DEV_CORE_DATA\Logs\benchmarks\*.json
          if-no-files-found: error
